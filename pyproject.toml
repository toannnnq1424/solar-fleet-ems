[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "solar-fleet-ems"
version = "0.2.0"
description = "Evidence-backed local-first solar fleet controller"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "cryptography>=44,<50", "keyring>=25,<26",
  "jsonschema>=4.23,<5", "websockets>=14,<17",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
local-solarman = ["pysolarmanv5==3.0.6"]
profile-import = ["PyYAML==6.0.3"]
browser-test = ["playwright>=1.50,<2"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2", "hatchling>=1.27,<2"]

[project.scripts]
solar-fleet = "solar_fleet.cli:main"
solar-fleet-agent = "solar_fleet.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_fleet"]

[tool.hatch.build.targets.sdist]
exclude = ["/images"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
