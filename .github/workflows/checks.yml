name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official ref
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: node --check src/solar_fleet/static/app.js
      - run: python -m build --no-isolation
